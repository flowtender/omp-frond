name: Monitor UI upstreams

on:
  schedule:
    - cron: "43 8 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report comparisons without creating or changing issues"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: monitor-upstreams
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out monitoring configuration
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Update upstream review issues
        uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ inputs.dry_run || false }}
        with:
          script: |
            const { monitorUpstreams } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/monitor-upstreams.mjs`);
            await monitorUpstreams({ github, context, core, dryRun: process.env.DRY_RUN === "true" });
