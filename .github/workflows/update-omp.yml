name: Update omp dependency

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-omp
  cancel-in-progress: false

jobs:
  update:
    name: Propose an SDK compatibility update
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out integration
        uses: actions/checkout@v4
        with:
          ref: integration

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Read latest stable release and check for an existing PR
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const { data: release } = await github.rest.repos.getLatestRelease({
              owner: "can1357",
              repo: "oh-my-pi",
            });
            const version = String(release.tag_name || "").replace(/^v/, "");
            if (!/^\d+\.\d+\.\d+$/.test(version)) {
              throw new Error(`Unexpected stable release: ${release.tag_name}`);
            }
            const { data: prs } = await github.rest.pulls.list({
              ...context.repo,
              state: "open",
              base: "integration",
              head: `${context.repo.owner}:automation/omp-${version}`,
            });
            core.setOutput("version", version);
            core.setOutput("url", release.html_url);
            core.setOutput("existing", prs.length > 0 ? "true" : "false");
            if (prs.length) {
              core.notice(`Existing update: ${prs[0].html_url}; leaving its source adaptations untouched.`);
            }

      - name: Check whether the release is newer
        id: plan
        if: steps.release.outputs.existing == 'false'
        env:
          OMP_VERSION: ${{ steps.release.outputs.version }}
        run: |
          bun - <<'JS'
          const fs = require("node:fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const current = pkg.dependencies["@oh-my-pi/pi-coding-agent"];
          if (!/^\d+\.\d+\.\d+$/.test(current)) {
            throw new Error(`Expected an exact SDK pin, got ${current}`);
          }
          const installed = current.split(".").map(Number);
          const latest = process.env.OMP_VERSION.split(".").map(Number);
          let newer = false;
          for (let index = 0; index < latest.length; index++) {
            if (latest[index] === installed[index]) continue;
            newer = latest[index] > installed[index];
            break;
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `proceed=${newer}\n`);
          JS

      - name: Check matching SDK packages are published
        id: npm
        if: steps.plan.outputs.proceed == 'true'
        env:
          OMP_VERSION: ${{ steps.release.outputs.version }}
        run: |
          published=true
          for package in pi-agent-core pi-ai pi-coding-agent pi-tui pi-utils; do
            version="$(npm view "@oh-my-pi/${package}@${OMP_VERSION}" version --silent)" || version=""
            if [[ "$version" != "$OMP_VERSION" ]]; then
              published=false
              echo "::notice::${package}@${OMP_VERSION} is not available; try again on the next run."
            fi
          done
          echo "published=$published" >> "$GITHUB_OUTPUT"

      - name: Pin the SDK package family
        if: steps.npm.outputs.published == 'true'
        env:
          OMP_VERSION: ${{ steps.release.outputs.version }}
        run: |
          bun - <<'JS'
          const fs = require("node:fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          for (const name of ["pi-agent-core", "pi-ai", "pi-coding-agent", "pi-tui", "pi-utils"]) {
            const key = `@oh-my-pi/${name}`;
            if (!pkg.dependencies?.[key]) throw new Error(`Missing dependency ${key}`);
            pkg.dependencies[key] = process.env.OMP_VERSION;
          }
          fs.writeFileSync("package.json", `${JSON.stringify(pkg, null, 2)}\n`);
          JS

      # Keep a failed lockfile refresh visible as a draft update, too.
      - name: Refresh lockfile
        id: lock
        if: steps.npm.outputs.published == 'true'
        continue-on-error: true
        run: bun install --lockfile-only

      - name: Verify SDK compatibility
        id: verify
        if: steps.npm.outputs.published == 'true' && steps.lock.outcome == 'success'
        continue-on-error: true
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test

      - name: Open a draft compatibility PR
        if: steps.npm.outputs.published == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          base: integration
          branch: automation/omp-${{ steps.release.outputs.version }}
          draft: always-true
          add-paths: |
            package.json
            bun.lock
          commit-message: "chore: propose omp SDK ${{ steps.release.outputs.version }}"
          title: "sdk: review omp ${{ steps.release.outputs.version }} compatibility"
          body: |
            Pins the SDK family to `${{ steps.release.outputs.version }}` on `integration`.

            Upstream release: ${{ steps.release.outputs.url }}
            Lockfile refresh: **${{ steps.lock.outcome }}**
            Install, typecheck, and tests: **${{ steps.verify.outcome }}**
            Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            - [ ] Review upstream breaking changes and adapt source code.
            - [ ] Resolve any lockfile, typecheck, or test failures.
            - [ ] Verify affected runtime paths, including sessions and extension UI.

            This stays a draft even when checks pass. There is no automatic merge,
            application version bump, release, or npm publishing.

            This PR uses GitHub's built-in token. Approve any waiting CI workflows
            in the PR banner; verification above also runs in this updater.
            Subsequent human-pushed source adaptations trigger normal PR CI.
            Later updater runs leave this open PR untouched.
